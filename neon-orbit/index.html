<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070918">
<title>Neon Orbit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070918;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}.screen{position:fixed;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(rgba(7,9,24,.24),rgba(7,9,24,.82))}.hidden{display:none}.card{width:min(410px,94vw);padding:28px 22px;border:1px solid rgba(119,217,255,.22);border-radius:28px;text-align:center;color:white;background:rgba(12,17,44,.9);box-shadow:0 25px 70px rgba(0,0,0,.45)}h1{margin:5px 0;font-size:54px;line-height:.9;letter-spacing:-4px;background:linear-gradient(110deg,#fff,#42f5ff,#ff4fd8);-webkit-background-clip:text;color:transparent}p{color:#b9c2e8;line-height:1.45;margin:14px 0 22px}.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.tip{padding:11px 5px;border-radius:14px;background:rgba(255,255,255,.05);font-size:11px;color:#d6dcfa}.tip b{display:block;font-size:21px;margin-bottom:4px}button{width:100%;min-height:56px;border:0;border-radius:18px;font-size:17px;font-weight:900;color:#07101a;background:linear-gradient(110deg,#42f5ff,#ffe66d);box-shadow:0 10px 30px rgba(66,245,255,.22);touch-action:manipulation}.small{margin-top:12px;color:#aeb8df;font-size:13px}.scoreBig{font-size:66px;font-weight:950;line-height:1;margin:10px 0}.hud{position:fixed;z-index:5;top:max(14px,env(safe-area-inset-top));left:max(15px,env(safe-area-inset-left));right:max(15px,env(safe-area-inset-right));display:none;justify-content:space-between;align-items:flex-start;color:white;pointer-events:none}.hud.show{display:flex}.pill{padding:10px 13px;border-radius:16px;background:rgba(7,9,24,.68);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px)}.label{font-size:10px;letter-spacing:2px;color:#aab4dc}.value{font-size:25px;font-weight:900}.bar{width:145px;height:7px;margin-top:7px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff4fd8,#42f5ff);transform-origin:left}.pause{position:fixed;z-index:7;top:max(14px,env(safe-area-inset-top));right:max(15px,env(safe-area-inset-right));display:none;width:46px;min-height:46px;border-radius:15px;padding:0;color:white;background:rgba(7,9,24,.75);border:1px solid rgba(255,255,255,.13);box-shadow:none}.pause.show{display:block}.notice{position:fixed;z-index:8;top:92px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:rgba(7,9,24,.8);color:white;font-size:12px;font-weight:800;opacity:0;transition:.2s;pointer-events:none}.notice.show{opacity:1}@media(orientation:landscape) and (max-height:500px){.card{padding:18px}.tips{display:none}h1{font-size:42px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hud"><div class="pill"><div class="label">SCORE</div><div id="score" class="value">0</div><div class="bar"><div id="energy" class="fill"></div></div></div></div>
<button id="pause" class="pause" aria-label="Pause">Ⅱ</button>
<div id="notice" class="notice"></div>
<section id="menu" class="screen"><div class="card"><div class="label" style="color:#42f5ff">ONE-THUMB ARCADE</div><h1>NEON<br>ORBIT</h1><p>Drag the glowing pulse left and right. Collect energy stars and survive the falling void shards.</p><div class="tips"><div class="tip"><b>↔</b>Drag</div><div class="tip"><b>✦</b>Collect</div><div class="tip"><b>◆</b>Dodge</div></div><button id="start">ENTER THE ORBIT</button><div class="small">Best score: <b id="bestA">0</b></div></div></section>
<section id="paused" class="screen hidden"><div class="card"><div class="label">ORBIT SUSPENDED</div><h1 style="font-size:48px">PAUSED</h1><button id="resume">RESUME</button></div></section>
<section id="over" class="screen hidden"><div class="card"><div class="label">FINAL SCORE</div><div id="final" class="scoreBig">0</div><p id="summary">You survived the orbit.</p><button id="again">PLAY AGAIN</button><div class="small">Best score: <b id="bestB">0</b></div></div></section>
<script>
(function(){
'use strict';
var c=document.getElementById('game'),x=c.getContext('2d');
var menu=document.getElementById('menu'),over=document.getElementById('over'),paused=document.getElementById('paused'),hud=document.getElementById('hud'),pauseBtn=document.getElementById('pause');
var scoreEl=document.getElementById('score'),energyEl=document.getElementById('energy'),finalEl=document.getElementById('final'),summaryEl=document.getElementById('summary'),notice=document.getElementById('notice');
var W=0,H=0,D=1,last=0,mode='menu',score=0,energy=100,time=0,best=parseInt(localStorage.getItem('neonOrbitBest')||'0',10),drag=false,spawn=0,starSpawn=0,powerSpawn=0,shield=0,slow=0,shake=0;
var player={x:0,y:0,target:0,r:14},obs=[],stars=[],parts=[],bg=[];
document.getElementById('bestA').textContent=best;document.getElementById('bestB').textContent=best;
function resize(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);player.y=H*.78;if(!player.x)player.x=player.target=W/2;bg=[];for(var i=0;i<Math.min(100,Math.floor(W*H/7000));i++)bg.push({x:Math.random()*W,y:Math.random()*H,z:.25+Math.random()*.75});}
function tap(id,fn){var el=document.getElementById(id),busy=false;el.addEventListener('click',function(e){e.preventDefault();if(!busy)fn();});el.addEventListener('touchend',function(e){e.preventDefault();busy=true;fn();setTimeout(function(){busy=false},350);},{passive:false});}
function start(){score=0;energy=100;time=0;spawn=.35;starSpawn=.55;powerSpawn=7;shield=0;slow=0;shake=0;obs=[];stars=[];parts=[];player.x=player.target=W/2;mode='play';menu.classList.add('hidden');over.classList.add('hidden');paused.classList.add('hidden');hud.classList.add('show');pauseBtn.classList.add('show');last=performance.now();}
function pause(){if(mode!=='play')return;mode='pause';paused.classList.remove('hidden');pauseBtn.classList.remove('show');}
function resume(){if(mode!=='pause')return;mode='play';paused.classList.add('hidden');pauseBtn.classList.add('show');last=performance.now();}
function end(){if(mode!=='play')return;mode='over';burst(player.x,player.y,'#ff4fd8',42);shake=15;var s=Math.floor(score);if(s>best){best=s;localStorage.setItem('neonOrbitBest',best)}finalEl.textContent=s;summaryEl.textContent='Energy stars collected: '+Math.floor(time/2);document.getElementById('bestA').textContent=best;document.getElementById('bestB').textContent=best;setTimeout(function(){over.classList.remove('hidden');hud.classList.remove('show');pauseBtn.classList.remove('show')},280);}
function toast(t){notice.textContent=t;notice.classList.add('show');setTimeout(function(){notice.classList.remove('show')},900)}
function burst(px,py,col,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=60+Math.random()*170;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.45,col:col})}}
function addObs(){var bar=Math.random()<.28,w=bar?55+Math.random()*105:24+Math.random()*28,h=bar?16+Math.random()*10:w;obs.push({x:25+Math.random()*(W-50),y:-40,w:w,h:h,a:Math.random()*6.28,spin:(Math.random()-.5)*2,bar:bar})}
function addStar(){stars.push({x:26+Math.random()*(W-52),y:-25,r:8,t:Math.random()*6.28,power:false})}
function addPower(){stars.push({x:35+Math.random()*(W-70),y:-30,r:14,t:0,power:true})}
function hit(o){var dx=Math.abs(player.x-o.x),dy=Math.abs(player.y-o.y);return dx<o.w/2+player.r*.65&&dy<o.h/2+player.r*.65}
function update(dt){time+=dt;var speed=(275+Math.min(260,time*5))*(slow>0?.58:1);score+=dt*(10+time*.18);energy-=dt*(2.4+Math.min(2,time/30));if(energy<=0){energy=0;end();return}shield=Math.max(0,shield-dt);slow=Math.max(0,slow-dt);player.x+=(player.target-player.x)*(1-Math.pow(.001,dt));
spawn-=dt;if(spawn<=0){addObs();spawn=Math.max(.27,.72-time*.006)*(.82+Math.random()*.38)}starSpawn-=dt;if(starSpawn<=0){addStar();starSpawn=.7+Math.random()*.65}powerSpawn-=dt;if(powerSpawn<=0){addPower();powerSpawn=8+Math.random()*6}
for(var i=0;i<bg.length;i++){bg[i].y+=speed*bg[i].z*.34*dt;if(bg[i].y>H)bg[i].y=-4}
for(i=obs.length-1;i>=0;i--){var o=obs[i];o.y+=speed*dt;o.a+=o.spin*dt;if(hit(o)){if(shield>0){shield=0;burst(o.x,o.y,'#42f5ff',24);obs.splice(i,1);toast('SHIELD BROKEN');navigator.vibrate&&navigator.vibrate([20,25,20]);continue}else{end();return}}if(o.y-o.h>H+40)obs.splice(i,1)}
for(i=stars.length-1;i>=0;i--){var s=stars[i];s.y+=speed*.86*dt;s.t+=dt*4;if(Math.hypot(player.x-s.x,player.y-s.y)<player.r+s.r+5){if(s.power){if(Math.random()<.55){shield=7;toast('SHIELD ONLINE')}else{slow=5;toast('TIME SLOWED')}}else{energy=Math.min(100,energy+10);score+=45}burst(s.x,s.y,s.power?'#ffe66d':'#42f5ff',14);navigator.vibrate&&navigator.vibrate(8);stars.splice(i,1);continue}if(s.y>H+30)stars.splice(i,1)}
for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;if(p.life<=0)parts.splice(i,1)}shake=Math.max(0,shake-dt*25);scoreEl.textContent=Math.floor(score);energyEl.style.transform='scaleX('+(energy/100)+')';}
function draw(){x.save();if(shake>0)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#131b49');g.addColorStop(.55,'#070918');g.addColorStop(1,'#03040a');x.fillStyle=g;x.fillRect(0,0,W,H);for(var i=0;i<bg.length;i++){x.globalAlpha=.15+bg[i].z*.5;x.fillStyle='#c9faff';x.fillRect(bg[i].x,bg[i].y,1+bg[i].z,2+bg[i].z*5)}x.globalAlpha=1;
for(i=stars.length-1;i>=0;i--){var s=stars[i],pulse=1+Math.sin(s.t)*.12;x.save();x.translate(s.x,s.y);x.scale(pulse,pulse);x.shadowColor=s.power?'#ffe66d':'#42f5ff';x.shadowBlur=18;x.fillStyle=s.power?'#ffe66d':'#dfffff';x.beginPath();for(var k=0;k<8;k++){var a=-Math.PI/2+k*Math.PI/4,r=k%2===0?s.r+5:s.r*.45;k?x.lineTo(Math.cos(a)*r,Math.sin(a)*r):x.moveTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();x.restore()}
for(i=0;i<obs.length;i++){var o=obs[i];x.save();x.translate(o.x,o.y);x.rotate(o.a);x.shadowColor='#ff4fd8';x.shadowBlur=17;x.fillStyle='#ff4fd8';if(o.bar){x.beginPath();x.roundRect(-o.w/2,-o.h/2,o.w,o.h,7);x.fill()}else{x.beginPath();x.moveTo(0,-o.h/2);x.lineTo(o.w/2,o.h*.1);x.lineTo(o.w*.12,o.h/2);x.lineTo(-o.w/2,o.h*.05);x.closePath();x.fill()}x.restore()}
for(i=0;i<parts.length;i++){var p=parts[i];x.globalAlpha=Math.max(0,p.life/.7);x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3)}x.globalAlpha=1;if(mode!=='menu'){if(shield>0){x.strokeStyle='rgba(66,245,255,.7)';x.lineWidth=3;x.shadowColor='#42f5ff';x.shadowBlur=18;x.beginPath();x.arc(player.x,player.y,player.r+13,0,Math.PI*2);x.stroke();x.shadowBlur=0}var q=x.createRadialGradient(player.x-5,player.y-6,1,player.x,player.y,player.r+4);q.addColorStop(0,'#fff');q.addColorStop(.45,'#b9fbff');q.addColorStop(1,'#2c75cf');x.fillStyle=q;x.shadowColor='#42f5ff';x.shadowBlur=25;x.beginPath();x.arc(player.x,player.y,player.r,0,Math.PI*2);x.fill();x.shadowBlur=0}x.restore()}
function loop(n){var dt=Math.min(.033,Math.max(0,(n-last)/1000||0));last=n;if(mode==='play')update(dt);else{for(var i=0;i<bg.length;i++){bg[i].y+=8*bg[i].z*dt;if(bg[i].y>H)bg[i].y=-3}}draw();requestAnimationFrame(loop)}
function move(e){if(mode!=='play')return;var t=e.touches?e.touches[0]:e;player.target=Math.max(18,Math.min(W-18,t.clientX));e.preventDefault()}
c.addEventListener('pointerdown',function(e){drag=true;move(e)},{passive:false});c.addEventListener('pointermove',function(e){if(drag)move(e)},{passive:false});c.addEventListener('pointerup',function(){drag=false});c.addEventListener('touchstart',function(e){drag=true;move(e)},{passive:false});c.addEventListener('touchmove',function(e){if(drag)move(e)},{passive:false});c.addEventListener('touchend',function(){drag=false},{passive:false});
tap('start',start);tap('again',start);tap('resume',resume);tap('pause',pause);document.addEventListener('visibilitychange',function(){if(document.hidden&&mode==='play')pause()});addEventListener('resize',resize);resize();last=performance.now();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
